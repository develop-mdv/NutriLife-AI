name: Deploy Server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: VPS_REPO_PATH
          script: |
            set -e

            cd "$VPS_REPO_PATH"

            echo "==> Pulling latest changes..."
            git pull origin main

            cd server

            echo "==> Saving current image as fallback..."
            docker tag nutrilife-api:latest nutrilife-api:rollback 2>/dev/null || true

            echo "==> Building and starting containers..."
            docker compose down --remove-orphans 2>/dev/null || true
            docker compose up -d --build

            echo "==> Waiting for health check..."
            sleep 5

            if curl -sf http://localhost:4000/api/health > /dev/null; then
              echo "==> Deploy successful! Server is healthy."
              docker image rm nutrilife-api:rollback 2>/dev/null || true
            else
              echo "==> Health check failed! Rolling back..."
              docker compose down
              docker tag nutrilife-api:rollback nutrilife-api:latest 2>/dev/null || true
              docker compose up -d
              echo "==> Rollback complete."
              exit 1
            fi
        env:
          VPS_REPO_PATH: ${{ secrets.VPS_REPO_PATH }}

